/* ===== Seal Button ===== */
/* Standard */
<button class="dq-btn-seal">{text}</button>

/* Large with drop animation */
<button class="dq-btn-seal dq-btn-seal--lg dq-animate-seal-drop">{text}</button>

/* Small */
<button class="dq-btn-seal dq-btn-seal--sm">{text}</button>

/* Circle */
<button class="dq-btn-seal dq-btn-seal--circle">印</button>

/* Custom color */
<button class="dq-btn-seal" style="--dq-seal-bg: var(--dq-color-indigo-500);">{text}</button>
