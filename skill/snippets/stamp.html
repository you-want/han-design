<!-- Single char -->
<div class="dq-stamp">{char}</div>

<!-- Double char vertical -->
<div class="dq-stamp dq-stamp--2char">{char1}</div>

<!-- Large with gold border -->
<div class="dq-stamp dq-stamp--lg dq-stamp--border">{text}</div>

<!-- Group -->
<div class="dq-stamp-group">
  <div class="dq-stamp dq-stamp--sm">作者</div>
  <div class="dq-stamp dq-stamp--sm">之印</div>
</div>
