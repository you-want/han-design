<!doctype html>
<html lang="zh-CN" data-theme="pine-wheat" data-han-intensity="1" data-han-accent-families="pine-wheat">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>静室生活方式品牌</title>
    <link rel="stylesheet" href="../../skills/han-design/assets/han.css">
    <style>
      .han-btn { transition: color 0.2s ease, background-color 0.2s ease; }
    </style>
  </head>
  <body>
    <main>
      <section class="han-section" aria-labelledby="quiet-heading">
        <p class="han-eyebrow">QUIET DAILY GOODS</p>
        <h1 id="quiet-heading">留一点安静，给每天。</h1>
        <p>以自然材质和慢节奏用品，陪你把日常重新整理成清晰的片刻。</p>
        <a class="han-btn han-btn--primary" href="#collection">了解产品</a>
      </section>
      <section id="collection" class="han-section" aria-labelledby="collection-heading">
        <h2 id="collection-heading">今日选物</h2>
        <p>一组轻量、耐用、不过度打扰生活的器物。</p>
      </section>
    </main>
  </body>
</html>
