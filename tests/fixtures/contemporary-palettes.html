<!doctype html>
<html lang="zh-CN" data-theme="pine-wheat">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>当代配色主题校验</title>
    <link rel="stylesheet" href="../../skills/han-design/assets/han.css">
  </head>
  <body>
    <main class="han-container han-section">
      <p>当代配色主题</p>
      <h1>色彩应服务于信息层级</h1>
      <p>每套主题保留四个原始色，同时提供可读的文字、控件和焦点令牌。</p>
      <p><a href="#details">查看配色说明</a></p>
      <button type="button" class="han-btn-seal">确认</button>
      <section id="details" class="han-card-scroll" aria-labelledby="palette-heading">
        <header class="han-card-scroll__header" id="palette-heading">主题令牌</header>
        <div class="han-card-scroll__body">背景、文字、强调与焦点均使用语义化颜色。</div>
      </section>
    </main>
  </body>
</html>
