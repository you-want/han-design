<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>印章按钮 · 汉设计系统</title>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    body { padding: 60px 24px; }
    .demo-section { margin-bottom: 48px; }
    .demo-section h3 { margin-bottom: 20px; color: var(--dq-color-text-secondary); }
    .demo-row { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; }
    .demo-label { font-size: 14px; color: var(--dq-color-text-tertiary); margin-top: 8px; text-align: center; }
    .demo-item { display: flex; flex-direction: column; align-items: center; }
    code.inline { background: var(--dq-color-ink-100); padding: 2px 8px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="dq-container">
    <h1 style="text-align:center; margin-bottom:8px;">印章按钮</h1>
    <p style="text-align:center; color:var(--dq-color-text-secondary); margin-bottom:48px;">
      红色方形印章风格按钮，模拟印章盖下的视觉感
    </p>

    <!-- 基础用法 -->
    <div class="demo-section">
      <h3>基础用法</h3>
      <div class="demo-row">
        <div class="demo-item">
          <button class="dq-btn-seal">确认</button>
          <div class="demo-label">默认</div>
        </div>
        <div class="demo-item">
          <button class="dq-btn-seal dq-btn-seal--lg">提交</button>
          <div class="demo-label">大号</div>
        </div>
        <div class="demo-item">
          <button class="dq-btn-seal dq-btn-seal--sm">返回</button>
          <div class="demo-label">小号</div>
        </div>
        <div class="demo-item">
          <button class="dq-btn-seal dq-btn-seal--circle">印</button>
          <div class="demo-label">圆形</div>
        </div>
        <div class="demo-item">
          <button class="dq-btn-seal dq-btn-seal--drop">汉/button>
          <div class="demo-label">盖章动画</div>
        </div>
      </div>
    </div>

    <!-- 代码示例 -->
    <div class="demo-section">
      <h3>使用说明</h3>
      <pre><code><!-- 基础印章按钮 -->
<button class="dq-btn-seal">确认</button>

<!-- 大号 -->
<button class="dq-btn-seal dq-btn-seal--lg">提交</button>

<!-- 带盖章动画 -->
<button class="dq-btn-seal dq-btn-seal--drop">汉/button></code></pre>
    </div>

    <!-- 使用场景 -->
    <div class="demo-section">
      <h3>使用场景</h3>
      <ul>
        <li>关键 CTA 按钮，如"立即下单"、"确认提交"</li>
        <li>表单提交、用户确认等重要操作</li>
        <li>品牌落款、认证标记</li>
        <li>建议占比 ≤ 5%，避免视觉疲劳</li>
      </ul>
    </div>

    <!-- 自定义颜色 -->
    <div class="demo-section">
      <h3>自定义色调（通过 CSS 变量）</h3>
      <div class="demo-row">
        <div class="demo-item">
          <button class="dq-btn-seal" style="--dq-seal-bg: var(--dq-color-indigo-500); --dq-seal-bg-hover: var(--dq-color-indigo-600); --dq-seal-border: var(--dq-color-gold-400);">靛蓝</button>
          <div class="demo-label">靛蓝</div>
        </div>
        <div class="demo-item">
          <button class="dq-btn-seal" style="--dq-seal-bg: var(--dq-color-bamboo); --dq-seal-bg-hover: #3d6649; --dq-seal-border: var(--dq-color-gold-500);">竹青</button>
          <div class="demo-label">竹青</div>
        </div>
        <div class="demo-item">
          <button class="dq-btn-seal" style="--dq-seal-bg: var(--dq-color-ink-700); --dq-seal-bg-hover: var(--dq-color-ink-800); --dq-seal-border: var(--dq-color-gold-500);">墨色</button>
          <div class="demo-label">墨色</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
