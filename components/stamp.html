<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>印章 · 汉设计系统</title>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    body { padding: 60px 24px; }
    .demo-section { margin-bottom: 48px; }
    .demo-section h3 { margin-bottom: 20px; color: var(--dq-color-text-secondary); }
    .demo-row { display: flex; flex-wrap: wrap; gap: 32px; align-items: center; }
    .demo-label { font-size: 14px; color: var(--dq-color-text-tertiary); margin-top: 12px; text-align: center; }
    .demo-item { display: flex; flex-direction: column; align-items: center; }
  </style>
</head>
<body>
  <div class="dq-container">
    <h1 style="text-align:center; margin-bottom:8px;">印章</h1>
    <p style="text-align:center; color:var(--dq-color-text-secondary); margin-bottom:48px;">
      红色方形印章组件，可用于署名或强调
    </p>

    <!-- 基础印章 -->
    <div class="demo-section">
      <h3>基础印章</h3>
      <div class="demo-row">
        <div class="demo-item">
          <div class="dq-stamp">丹</div>
          <div class="demo-label">单字印章</div>
        </div>
        <div class="demo-item">
          <div class="dq-stamp dq-stamp--2char">汉/div>
          <div class="demo-label">双字印章</div>
        </div>
        <div class="demo-item">
          <div class="dq-stamp dq-stamp--4char">汉设计</div>
          <div class="demo-label">四字印章</div>
        </div>
      </div>
    </div>

    <!-- 不同尺寸 -->
    <div class="demo-section">
      <h3>尺寸变体</h3>
      <div class="demo-row">
        <div class="demo-item">
          <div class="dq-stamp dq-stamp--sm">小</div>
          <div class="demo-label">小号 36px</div>
        </div>
        <div class="demo-item">
          <div class="dq-stamp">默认</div>
          <div class="demo-label">默认 48px</div>
        </div>
        <div class="demo-item">
          <div class="dq-stamp dq-stamp--lg">汉/div>
          <div class="demo-label">大号 72px</div>
        </div>
      </div>
    </div>

    <!-- 特殊变体 -->
    <div class="demo-section">
      <h3>特殊样式</h3>
      <div class="demo-row">
        <div class="demo-item">
          <div class="dq-stamp dq-stamp--square">正</div>
          <div class="demo-label">方形（不倒角）</div>
        </div>
        <div class="demo-item">
          <div class="dq-stamp dq-stamp--border">御笔</div>
          <div class="demo-label">带金边</div>
        </div>
        <div class="demo-item">
          <div class="dq-stamp dq-stamp--2char dq-stamp--border dq-stamp--lg">汉/div>
          <div class="demo-label">金边大号</div>
        </div>
      </div>
    </div>

    <!-- 印章组 -->
    <div class="demo-section">
      <h3>印章组（署名用法）</h3>
      <div class="demo-row">
        <div class="dq-stamp-group">
          <div class="dq-stamp dq-stamp--sm">作者</div>
          <div class="dq-stamp dq-stamp--sm">汉/div>
          <div class="dq-stamp dq-stamp--sm">之印</div>
        </div>
      </div>
      <p style="margin-top: 16px; color: var(--dq-color-text-secondary); text-indent: 0;">
        —— 常用于文章署名、作品落款，三个小印章并排排列，错落有致。
      </p>
    </div>

    <!-- 代码示例 -->
    <div class="demo-section">
      <h3>HTML 结构</h3>
      <pre><code><!-- 单字印章 -->
<div class="dq-stamp">丹</div>

<!-- 双字印章 -->
<div class="dq-stamp dq-stamp--2char">汉/div>

<!-- 四字印章 -->
<div class="dq-stamp dq-stamp--4char">汉设计</div>

<!-- 带金边大号印章 -->
<div class="dq-stamp dq-stamp--lg dq-stamp--border">汉/div>

<!-- 印章组 -->
<div class="dq-stamp-group">
  <div class="dq-stamp dq-stamp--sm">作者</div>
  <div class="dq-stamp dq-stamp--sm">之印</div>
</div></code></pre>
    </div>
  </div>
</body>
</html>
