<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>主题切换 · 汉设计系统</title>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/themes.css">
  <style>
    * { transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease; }
    
    .theme-showcase {
      min-height: 100vh;
      padding: 48px 24px;
      font-family: var(--dq-font-song);
      color: var(--dq-color-text-primary);
      background: var(--dq-color-bg);
    }
    
    .theme-header {
      text-align: center;
      max-width: 800px;
      margin: 0 auto 48px;
    }
    
    .theme-header h1 {
      font-family: var(--dq-font-kai);
      font-size: var(--dq-fs-5xl);
      font-weight: var(--dq-fw-bold);
      letter-spacing: var(--dq-ls-wider);
      color: var(--dq-color-text-primary);
      margin-bottom: 16px;
    }
    
    .theme-header p {
      font-size: var(--dq-fs-lg);
      color: var(--dq-color-text-secondary);
      line-height: var(--dq-lh-relaxed);
    }
    
    .theme-switcher {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 48px;
      padding: 24px;
      background: var(--dq-color-bg-surface);
      border: 1px solid var(--dq-color-border);
      border-radius: var(--dq-radius-lg);
    }
    
    .theme-btn {
      padding: 10px 20px;
      font-family: var(--dq-font-kai);
      font-size: var(--dq-fs-base);
      color: var(--dq-color-text-secondary);
      background: var(--dq-color-bg-elevated);
      border: 1px solid var(--dq-color-border);
      border-radius: var(--dq-radius-md);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .theme-btn:hover {
      color: var(--dq-color-text-primary);
      border-color: var(--dq-color-accent);
    }
    
    .theme-btn.active {
      color: var(--dq-seal-text);
      background: var(--dq-seal-bg);
      border-color: var(--dq-seal-bg);
    }
    
    .preview-card {
      max-width: 900px;
      margin: 0 auto;
      padding: 48px;
      background: var(--dq-color-bg-surface);
      border: 1px solid var(--dq-color-border);
      border-radius: var(--dq-radius-xl);
    }
    
    .preview-section {
      margin-bottom: 48px;
    }
    
    .preview-section:last-child {
      margin-bottom: 0;
    }
    
    .preview-label {
      font-family: var(--dq-font-kai);
      font-size: var(--dq-fs-sm);
      color: var(--dq-color-text-tertiary);
      letter-spacing: var(--dq-ls-wide);
      margin-bottom: 12px;
    }
    
    .demo-hero {
      text-align: center;
      padding: 48px 24px;
      background: var(--dq-color-bg-elevated);
      border-radius: var(--dq-radius-lg);
      position: relative;
    }
    
    .demo-hero h2 {
      font-family: var(--dq-font-kai);
      font-size: var(--dq-fs-4xl);
      font-weight: var(--dq-fw-bold);
      letter-spacing: var(--dq-ls-wider);
      color: var(--dq-color-text-primary);
      margin-bottom: 12px;
    }
    
    .demo-hero p {
      font-size: var(--dq-fs-md);
      color: var(--dq-color-text-secondary);
      margin-bottom: 24px;
    }
    
    .demo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 24px;
    }
    
    .demo-item {
      padding: 20px;
      background: var(--dq-color-bg-elevated);
      border-radius: var(--dq-radius-md);
      text-align: center;
    }
    
    .demo-item .dq-stamp {
      margin: 0 auto 12px;
    }
    
    .demo-item h4 {
      font-family: var(--dq-font-kai);
      font-size: var(--dq-fs-base);
      color: var(--dq-color-text-primary);
    }
    
    .color-palette {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    .color-swatch {
      width: 48px;
      height: 48px;
      border-radius: var(--dq-radius-md);
      border: 2px solid var(--dq-color-border);
    }
    
    .color-swatch.paper { background: var(--dq-color-bg); }
    .color-swatch.surface { background: var(--dq-color-bg-surface); }
    .color-swatch.accent { background: var(--dq-color-accent); }
    .color-swatch.seal { background: var(--dq-seal-bg); }
    
    .dark-mode-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
      font-size: var(--dq-fs-sm);
      color: var(--dq-color-text-secondary);
    }
    
    .dark-mode-toggle label {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="theme-showcase">
    <div class="theme-header">
      <h1>汉 · 主题花园</h1>
      <p>17 种主题 · 10 国风 + 7 朝代，一键切换东方美学</p>
    </div>
    
    <div class="theme-switcher" id="themeSwitcher">
      <button class="theme-btn active" data-theme="">汉</button>
      <button class="theme-btn" data-theme="ink">水墨</button>
      <button class="theme-btn" data-theme="landscape">青绿山水</button>
      <button class="theme-btn" data-theme="porcelain">青花瓷</button>
      <button class="theme-btn" data-theme="dunhuang">敦煌</button>
      <button class="theme-btn" data-theme="imperial">宫廷金</button>
      <button class="theme-btn" data-theme="wuxia">武侠玄墨</button>
      <button class="theme-btn" data-theme="tea">茶道禅意</button>
      <button class="theme-btn" data-theme="vermilion">朱砂喜庆</button>
      <button class="theme-btn" data-theme="celadon">青瓷</button>
    </div>
    
    <div class="preview-label" style="text-align:center; margin-bottom:16px;">◆ 朝代主题 · 千年穿越</div>
    <div class="theme-switcher" id="dynastySwitcher">
      <button class="theme-btn" data-theme="qinhan">秦汉·雄浑</button>
      <button class="theme-btn" data-theme="weijin">魏晋·飘逸</button>
      <button class="theme-btn" data-theme="tang">大唐·华美</button>
      <button class="theme-btn" data-theme="song">大宋·清雅</button>
      <button class="theme-btn" data-theme="yuan">元代·粗放</button>
      <button class="theme-btn" data-theme="ming">大明·精致</button>
      <button class="theme-btn" data-theme="qing">大清·繁缛</button>
    </div>
    
    <div class="dark-mode-toggle">
      <input type="checkbox" id="darkToggle">
      <label for="darkToggle">深色模式</label>
    </div>
    
    <div class="preview-card">
      <div class="preview-section">
        <div class="preview-label">◆ 主题预览</div>
        <div class="demo-hero">
          <h2 id="themeName">汉</h2>
          <p id="themeDesc">朱红印章 + 宣纸质感，典雅东方</p>
          <button class="dq-btn-seal dq-btn-seal--lg">立即体验</button>
        </div>
      </div>
      
      <div class="preview-section">
        <div class="preview-label">◆ 组件演示</div>
        <div class="demo-grid">
          <div class="demo-item">
            <div class="dq-stamp">印</div>
            <h4>印章</h4>
          </div>
          <div class="demo-item">
            <div class="dq-stamp dq-stamp--2char">汉</div>
            <h4>双字印章</h4>
          </div>
          <div class="demo-item">
            <button class="dq-btn-seal dq-btn-seal--sm">按钮</button>
            <h4>印章按钮</h4>
          </div>
        </div>
      </div>
      
      <div class="preview-section">
        <div class="preview-label">◆ 色彩体系</div>
        <div class="color-palette">
          <div class="color-swatch paper" title="页面背景"></div>
          <div class="color-swatch surface" title="卡片背景"></div>
          <div class="color-swatch accent" title="强调色"></div>
          <div class="color-swatch seal" title="印章色"></div>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    const themes = {
      '': { name: '汉', desc: '朱红印章 + 宣纸质感，典雅东方' },
      'ink': { name: '水墨', desc: '黑白灰意境，文人画留白' },
      'landscape': { name: '青绿山水', desc: '青山绿水，宋画意境' },
      'porcelain': { name: '青花瓷', desc: '蓝白雅致，景德镇风' },
      'dunhuang': { name: '敦煌', desc: '暖橙壁画，千年艺术' },
      'imperial': { name: '宫廷金', desc: '金色尊贵，皇室气派' },
      'wuxia': { name: '武侠玄墨', desc: '玄黑侠气，江湖暗色' },
      'tea': { name: '茶道禅意', desc: '素雅禅茶，枯山水意' },
      'vermilion': { name: '朱砂喜庆', desc: '大红喜庆，中国年味儿' },
      'celadon': { name: '青瓷', desc: '温润如玉，龙泉青瓷' },
      'qinhan': { name: '秦汉·雄浑古朴', desc: '玄黑土黄，帝国初兴，瓦当云气' },
      'weijin': { name: '魏晋·飘逸超然', desc: '月白青灰，士人风骨，飘逸脱俗' },
      'tang': { name: '大唐·雍容华美', desc: '朱红明金，盛世气象，富丽堂皇' },
      'song': { name: '大宋·清雅极简', desc: '天青月白，文人审美，极简高级感' },
      'yuan': { name: '元代·粗放多元', desc: '青花深红，民族融合，粗犷豪放' },
      'ming': { name: '大明·精致世俗', desc: '霁红宝石蓝，精致规整，雅俗共赏' },
      'qing': { name: '大清·繁缛富贵', desc: '粉彩大金，集大成者，繁复奢华' }
    };
    
    const html = document.documentElement;
    const buttons = document.querySelectorAll('.theme-btn');
    const themeName = document.getElementById('themeName');
    const themeDesc = document.getElementById('themeDesc');
    const darkToggle = document.getElementById('darkToggle');
    
    function setTheme(theme) {
      if (theme) {
        html.setAttribute('data-theme', theme);
      } else {
        html.removeAttribute('data-theme');
      }
      
      buttons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.theme === theme);
      });
      
      const info = themes[theme];
      if (info) {
        themeName.textContent = info.name;
        themeDesc.textContent = info.desc;
      }
      
      localStorage.setItem('han-theme', theme);
    }
    
    buttons.forEach(btn => {
      btn.addEventListener('click', () => setTheme(btn.dataset.theme));
    });
    
    darkToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        html.setAttribute('data-color-mode', 'dark');
      } else {
        html.removeAttribute('data-color-mode');
      }
      localStorage.setItem('han-dark', e.target.checked ? 'dark' : '');
    });
    
    const savedTheme = localStorage.getItem('han-theme') || '';
    const savedDark = localStorage.getItem('han-dark') === 'dark';
    darkToggle.checked = savedDark;
    setTheme(savedTheme);
  </script>
</body>
</html>
