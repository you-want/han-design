<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>印章按钮 · 汉</title>
  <link rel="stylesheet" href="../../skills/han-design/assets/tokens.css">
  <link rel="stylesheet" href="../../skills/han-design/assets/base.css">
  <link rel="stylesheet" href="../../skills/han-design/assets/components.css">
  <style>
    body { padding: 60px 24px; }
    .demo-section { margin-bottom: 48px; }
    .demo-section h3 { margin-bottom: 20px; color: var(--han-color-text-secondary); }
    .demo-row { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; }
    .demo-label { font-size: 14px; color: var(--han-color-text-tertiary); margin-top: 8px; text-align: center; }
    .demo-item { display: flex; flex-direction: column; align-items: center; }
    code.inline { background: var(--han-color-ink-100); padding: 2px 8px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="han-container">
    <h1 style="text-align:center; margin-bottom:8px;">印章按钮</h1>
    <p style="text-align:center; color:var(--han-color-text-secondary); margin-bottom:48px;">
      红色方形印章风格按钮，模拟印章盖下的视觉感
    </p>

    <!-- 基础用法 -->
    <div class="demo-section">
      <h3>基础用法</h3>
      <div class="demo-row">
        <div class="demo-item">
          <button class="han-btn-seal">确认</button>
          <div class="demo-label">默认</div>
        </div>
        <div class="demo-item">
          <button class="han-btn-seal han-btn-seal--lg">提交</button>
          <div class="demo-label">大号</div>
        </div>
        <div class="demo-item">
          <button class="han-btn-seal han-btn-seal--sm">返回</button>
          <div class="demo-label">小号</div>
        </div>
        <div class="demo-item">
          <button class="han-btn-seal han-btn-seal--circle">印</button>
          <div class="demo-label">圆形</div>
        </div>
        <div class="demo-item">
          <button class="han-btn-seal han-btn-seal--drop">汉</button>
          <div class="demo-label">盖章动画</div>
        </div>
      </div>
    </div>

    <!-- 代码示例 -->
    <div class="demo-section">
      <h3>使用说明</h3>
      <pre><code><!-- 基础印章按钮 -->
<button class="han-btn-seal">确认</button>

<!-- 大号 -->
<button class="han-btn-seal han-btn-seal--lg">提交</button>

<!-- 带盖章动画 -->
<button class="han-btn-seal han-btn-seal--drop">汉</button></code></pre>
    </div>

    <!-- 使用场景 -->
    <div class="demo-section">
      <h3>使用场景</h3>
      <ul>
        <li>关键 CTA 按钮，如"立即下单"、"确认提交"</li>
        <li>表单提交、用户确认等重要操作</li>
        <li>品牌落款、认证标记</li>
        <li>建议占比 ≤ 5%，避免视觉疲劳</li>
      </ul>
    </div>

    <!-- 自定义颜色 -->
    <div class="demo-section">
      <h3>自定义色调（通过 CSS 变量）</h3>
      <div class="demo-row">
        <div class="demo-item">
          <button class="han-btn-seal" style="--han-seal-bg: var(--han-color-indigo-500); --han-seal-bg-hover: var(--han-color-indigo-600); --han-seal-border: var(--han-color-gold-400);">靛蓝</button>
          <div class="demo-label">靛蓝</div>
        </div>
        <div class="demo-item">
          <button class="han-btn-seal" style="--han-seal-bg: var(--han-color-bamboo); --han-seal-bg-hover: #3d6649; --han-seal-border: var(--han-color-gold-500);">竹青</button>
          <div class="demo-label">竹青</div>
        </div>
        <div class="demo-item">
          <button class="han-btn-seal" style="--han-seal-bg: var(--han-color-ink-700); --han-seal-bg-hover: var(--han-color-ink-800); --han-seal-border: var(--han-color-gold-500);">墨色</button>
          <div class="demo-label">墨色</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 页面导航 -->
  <style>
    .han-nav-fab{position:fixed!important;right:16px!important;top:16px!important;z-index:99999!important;width:44px!important;height:44px!important;border-radius:50%!important;background:var(--han-color-ink-700,#2a2824)!important;color:#fff!important;border:none!important;cursor:pointer!important;box-shadow:0 4px 16px rgba(0,0,0,.25)!important;font-size:18px!important;display:flex!important;align-items:center!important;justify-content:center!important;font-family:var(--han-font-kai,KaiTi,serif)!important;}
    .han-nav-fab:hover{transform:scale(1.1)!important;}
    .han-nav-panel{position:fixed!important;right:16px!important;top:72px!important;z-index:99998!important;width:220px!important;max-height:70vh!important;overflow-y:auto!important;background:var(--han-color-paper-100,#faf6ea)!important;border-radius:12px!important;box-shadow:0 8px 32px rgba(0,0,0,.15)!important;border:1px solid var(--han-color-border,#e0dcd4)!important;padding:16px!important;display:none!important;}
    .han-nav-panel.is-open{display:block!important;}
    .han-nav-panel h4{margin:0 0 8px!important;font-family:var(--han-font-kai,KaiTi,serif)!important;font-size:13px!important;color:var(--han-color-ink-700,#2a2824)!important;}
    .han-nav-panel ul{list-style:none!important;margin:0 0 10px!important;padding:0!important;}
    .han-nav-panel li{margin:0!important;}
    .han-nav-panel a{display:block!important;padding:5px 10px!important;border-radius:6px!important;font-size:12px!important;color:var(--han-color-text-secondary,#555)!important;text-decoration:none!important;transition:all .15s!important;}
    .han-nav-panel a:hover{background:var(--han-color-vermilion-500,#c0392b)!important;color:#fff!important;}
    .han-nav-panel hr{border:none!important;border-top:1px solid var(--han-color-border,#e0dcd4)!important;margin:10px 0!important;}
    @media(max-width:768px){.han-nav-panel{width:180px!important;}}
  </style>
  <button class="han-nav-fab" onclick="document.getElementById('hanNavPanel').classList.toggle('is-open')">☰</button>
  <div class="han-nav-panel" id="hanNavPanel" onclick="event.stopPropagation()">
    <h4>示例页面</h4>
    <ul>
      <li><a href="/landing-page">落地页</a></li>
      <li><a href="/quick-start">快速上手</a></li>
      <li><a href="/theme-showcase">主题展示</a></li>
      <li><a href="/showcase">完整组件展示</a></li>
    </ul>
    <hr>
    <h4>组件示例</h4>
    <ul>
      <li><a href="/components/button-seal">印章按钮</a></li>
      <li><a href="/components/card-scroll">卷轴卡片</a></li>
      <li><a href="/components/divider-ink">水墨分割线</a></li>
      <li><a href="/components/frame-window">窗花边框</a></li>
      <li><a href="/components/navbar-ink">水墨导航</a></li>
      <li><a href="/components/stamp">印章</a></li>
    </ul>
  </div>
  <script>document.addEventListener("click",function(e){var p=document.getElementById("hanNavPanel");if(p&&!p.contains(e.target)&&!e.target.classList.contains("han-nav-fab"))p.classList.remove("is-open");});</script>

</body>
</html>
