<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- 扇子 Fan -->
  <g stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 扇骨 (ribs) -->
    <path d="M50 50 L50 12" />
    <path d="M50 50 L20 20" />
    <path d="M50 50 L12 50" />
    <path d="M50 50 L20 80" />
    <path d="M50 50 L50 88" />
    <path d="M50 50 L80 80" />
    <path d="M50 50 L88 50" />
    <path d="M50 50 L80 20" />
    <!-- 扇面弧线 -->
    <path d="M12 50 Q30 10 50 12 Q70 10 88 50" fill="currentColor" fill-opacity="0.08" />
    <path d="M20 20 Q50 24 80 20" />
    <path d="M20 80 Q50 76 80 80" />
    <!-- 中心铆钉 -->
    <circle cx="50" cy="50" r="3" fill="currentColor" />
    <circle cx="50" cy="50" r="1.5" fill="var(--paper-light)" />
    <!-- 书法题字装饰 -->
    <text x="50" y="32" text-anchor="middle" font-size="8" font-family="serif" fill="currentColor" opacity="0.6">汉</text>
  </g>
</svg>
