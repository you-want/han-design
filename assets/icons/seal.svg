<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <!-- 印章 Seal -->
  <g>
    <!-- 印章底 -->
    <rect x="6" y="6" width="48" height="48" rx="4" ry="4" 
          fill="var(--cinnabar, #c0392b)" 
          stroke="var(--cinnabar-deep, #9c2d22)" 
          stroke-width="1"
          transform="rotate(-3 30 30)" />
    <!-- 文字装饰纹理 -->
    <g transform="rotate(-3 30 30)" fill="var(--paper-light, #faf7ef)">
      <rect x="12" y="14" width="10" height="20" rx="1" />
      <rect x="25" y="14" width="10" height="20" rx="1" />
      <rect x="38" y="14" width="10" height="20" rx="1" />
      <rect x="12" y="38" width="10" height="8" rx="1" />
      <rect x="25" y="38" width="10" height="8" rx="1" />
      <rect x="38" y="38" width="10" height="8" rx="1" />
    </g>
    <!-- 斑驳纹理 -->
    <g transform="rotate(-3 30 30)" opacity="0.3" fill="var(--ink-900, #1a1816)">
      <circle cx="14" cy="14" r="2" />
      <circle cx="50" cy="14" r="1.5" />
      <circle cx="10" cy="50" r="1.8" />
      <circle cx="52" cy="48" r="2" />
      <circle cx="30" cy="30" r="1" />
    </g>
  </g>
</svg>
