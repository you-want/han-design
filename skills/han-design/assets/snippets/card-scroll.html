<article class="han-card-scroll">
  <span class="han-rivet han-rivet--tl" aria-hidden="true"></span>
  <span class="han-rivet han-rivet--tr" aria-hidden="true"></span>
  <span class="han-rivet han-rivet--bl" aria-hidden="true"></span>
  <span class="han-rivet han-rivet--br" aria-hidden="true"></span>
  <header class="han-card-scroll__header">{title}</header>
  <div class="han-card-scroll__body">
    <p>{description}</p>
  </div>
  <footer class="han-card-scroll__footer">
    <span>{meta}</span>
    <a href="{link_url}">{link_text} →</a>
  </footer>
</article>
