<!-- Seal button: standard -->
<button type="button" class="han-btn-seal">{text}</button>

<!-- Large with drop animation -->
<button type="button" class="han-btn-seal han-btn-seal--lg han-animate-seal-drop">{text}</button>

<!-- Small -->
<button type="button" class="han-btn-seal han-btn-seal--sm">{text}</button>

<!-- Circle -->
<button type="button" class="han-btn-seal han-btn-seal--circle" aria-label="{accessible_label}">印</button>

<!-- Custom color -->
<button type="button" class="han-btn-seal" style="--han-seal-bg: var(--han-color-accent-control); --han-seal-text: var(--han-color-on-accent);">{text}</button>
