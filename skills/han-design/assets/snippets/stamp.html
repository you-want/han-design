<!-- Decorative single char -->
<span class="han-stamp" aria-hidden="true">{char}</span>

<!-- Meaningful seal-inspired mark -->
<span class="han-stamp han-stamp--2char" role="img" aria-label="{seal_label}">{text}</span>

<!-- Large with gold border -->
<span class="han-stamp han-stamp--lg han-stamp--border" role="img" aria-label="{seal_label}">{text}</span>

<!-- Group -->
<div class="han-stamp-group" role="img" aria-label="{seal_group_label}">
  <span class="han-stamp han-stamp--sm" aria-hidden="true">作者</span>
  <span class="han-stamp han-stamp--sm" aria-hidden="true">之印</span>
</div>
